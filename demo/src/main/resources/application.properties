# ── Database ──────────────────────────────────────────────────────────────────
spring.datasource.url=jdbc:postgresql://${PGHOST}:${PGPORT}/${PGDATABASE}
spring.datasource.username=${PGUSER}
spring.datasource.password=${PGPASSWORD}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ── Server ────────────────────────────────────────────────────────────────────
server.port=${PORT:8080}

# ── JWT ───────────────────────────────────────────────────────────────────────
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:604800000}
jwt.refresh-window-ms=${JWT_REFRESH_WINDOW_MS:2592000000}

# ── Admin inicial (só cria se ainda não existir; senha só no Railway) ─────────
admin.email=${ADMIN_EMAIL:}
admin.password=${ADMIN_PASSWORD:}
admin.name=${ADMIN_NAME:Administrador}

# ── Mercado Pago ──────────────────────────────────────────────────────────────
mercadopago.public-key=${MERCADOPAGO_PUBLIC_KEY}
mercadopago.access-token=${MERCADOPAGO_ACCESS_TOKEN}

# ── Correios API (pré-postagem / etiqueta) ────────────────────────────────────
# Requer contrato + cartão de postagem. Ver docs/CORREIOS_SETUP.md
# ambiente: hom (apihom) | prod (api)
correios.username=${CORREIOS_USERNAME:}
correios.access-code=${CORREIOS_ACCESS_CODE:}
correios.cartao-postagem=${CORREIOS_CARTAO_POSTAGEM:}
correios.contrato=${CORREIOS_CONTRATO:}
correios.dr=${CORREIOS_DR:}
correios.ambiente=${CORREIOS_AMBIENTE:prod}
# Códigos do seu contrato (confirmar no CWS) — padrões comuns PAC/SEDEX a faturar
correios.codigo-pac=${CORREIOS_CODIGO_PAC:03298}
correios.codigo-sedex=${CORREIOS_CODIGO_SEDEX:03220}

# ── E-mail ────────────────────────────────────────────────────────────────────
# Preferência no Railway: Resend (HTTP). Crie em https://resend.com
# MAIL_FROM exemplo com domínio verificado: YoungsZone <loja@seudominio.com>
# Em testes: YoungsZone <onboarding@resend.dev> (só envia para o e-mail da conta Resend)
resend.api-key=${RESEND_API_KEY:}
app.mail.from=${MAIL_FROM:YoungsZone <onboarding@resend.dev>}

# Fallback SMTP (local / se não usar Resend). Gmail costuma dar timeout no Railway.
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# ── Frontend URL (CORS) ───────────────────────────────────────────────────────
app.frontend.url=${FRONTEND_URL:https://localhost:3000}

# URL pública do backend (webhook Mercado Pago). Se vazio, usa FRONTEND_URL.
app.public.url=${APP_PUBLIC_URL:}

# ── Loja (remetente / etiquetas Correios) ─────────────────────────────────────
loja.nome=${LOJA_NOME:}
loja.cpf=${LOJA_CPF:}
loja.telefone=${LOJA_TELEFONE:}
loja.email=${LOJA_EMAIL:}
loja.cep=${LOJA_CEP:}
loja.rua=${LOJA_RUA:}
loja.numero=${LOJA_NUMERO:}
loja.complemento=${LOJA_COMPLEMENTO:}
loja.bairro=${LOJA_BAIRRO:}
loja.cidade=${LOJA_CIDADE:}
loja.estado=${LOJA_ESTADO:}
loja.pacote.peso=${LOJA_PACOTE_PESO:0.5}
loja.pacote.altura=${LOJA_PACOTE_ALTURA:10}
loja.pacote.largura=${LOJA_PACOTE_LARGURA:15}
loja.pacote.comprimento=${LOJA_PACOTE_COMPRIMENTO:20}

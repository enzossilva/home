# ── Database ──────────────────────────────────────────────────────────────────
spring.datasource.url=jdbc:postgresql://${PGHOST}:${PGPORT}/${PGDATABASE}
spring.datasource.username=${PGUSER}
spring.datasource.password=${PGPASSWORD}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ── Server ────────────────────────────────────────────────────────────────────
server.port=${PORT:8080}

# ── JWT ───────────────────────────────────────────────────────────────────────
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:86400000}

# ── Mercado Pago ──────────────────────────────────────────────────────────────
mercadopago.public-key=${MERCADOPAGO_PUBLIC_KEY}
mercadopago.access-token=${MERCADOPAGO_ACCESS_TOKEN}

# ── Correios (integração direta) ──────────────────────────────────────────────
correios.username=${CORREIOS_USERNAME}
correios.access-code=${CORREIOS_ACCESS_CODE}

# ── E-mail (Spring Mail) ──────────────────────────────────────────────────────
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
app.mail.from=${MAIL_FROM:${MAIL_USERNAME}}

# ── Frontend URL (CORS) ───────────────────────────────────────────────────────
app.frontend.url=${FRONTEND_URL:https://localhost:3000}

# ── Loja (remetente / etiquetas) ──────────────────────────────────────────────
loja.nome=${LOJA_NOME}
loja.cpf=${LOJA_CPF}
loja.telefone=${LOJA_TELEFONE}
loja.email=${LOJA_EMAIL}
loja.cep=${LOJA_CEP}
loja.rua=${LOJA_RUA}
loja.numero=${LOJA_NUMERO}
loja.complemento=${LOJA_COMPLEMENTO:}
loja.bairro=${LOJA_BAIRRO}
loja.cidade=${LOJA_CIDADE}
loja.estado=${LOJA_ESTADO}
loja.pacote.peso=${LOJA_PACOTE_PESO:0.5}
loja.pacote.altura=${LOJA_PACOTE_ALTURA:10}
loja.pacote.largura=${LOJA_PACOTE_LARGURA:15}
loja.pacote.comprimento=${LOJA_PACOTE_COMPRIMENTO:20}
